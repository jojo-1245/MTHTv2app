pluginManagement {
  def rnGradleFromRn = file("../node_modules/react-native/node_modules/@react-native/gradle-plugin")
  def rnGradleHoisted = file("../node_modules/@react-native/gradle-plugin")
  def reactNativeGradlePlugin = rnGradleFromRn.exists() ? rnGradleFromRn : rnGradleHoisted
  includeBuild(reactNativeGradlePlugin.absolutePath)

  def expoGradlePlugin = file("../node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
  includeBuild(expoGradlePlugin.absolutePath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'MetaHint'

expoAutolinking.useExpoVersionCatalog()

include ':app'
def rnGradleFromRnRoot = file("../node_modules/react-native/node_modules/@react-native/gradle-plugin")
def rnGradleHoistedRoot = file("../node_modules/@react-native/gradle-plugin")
def rnGradlePluginDirBottom = rnGradleFromRnRoot.exists() ? rnGradleFromRnRoot : rnGradleHoistedRoot
includeBuild(rnGradlePluginDirBottom.absolutePath)

include ':fzljtilisignal-react-native-sdk:fzljtilisignal-sdk'
