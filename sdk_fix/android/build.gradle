buildscript {

  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["FzljtiliSignalReactNativeSDK_kotlinVersion"]

  repositories {
      google()
      mavenCentral()
  }

  dependencies {
      classpath "com.android.tools.build:gradle:8.7.3"

      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def appProject = rootProject.allprojects.find { it.plugins.hasPlugin('com.android.application') }

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["FzljtiliSignalReactNativeSDK_" + name]
}

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["FzljtiliSignalReactNativeSDK_" + name]).toInteger()
}

android {
    compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

    defaultConfig {
        minSdkVersion getExtOrIntegerDefault("minSdkVersion")
        targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
      disable "GradleCompatible"
   }

    compileOptions {
      sourceCompatibility JavaVersion.VERSION_11
      targetCompatibility JavaVersion.VERSION_11
    }
}

repositories {
    mavenCentral()
    google()

}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {

    implementation project(':fzljtilisignal-react-native-sdk:fzljtilisignal-sdk')
    implementation "com.facebook.react:react-native:0.82.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation 'com.segment.analytics.kotlin:android:1.16.3'
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "FzljtiliSignalReactNativeSDK"
    codegenJavaPackageName = "com.fzljtilisignal.react_native_sdk"
  }
}
