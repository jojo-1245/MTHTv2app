// Top-level build file where you can add configuration options common to all sub-projects/modules.

def forcedAbi = 'arm64-v8a'
try {
  def sp = gradle.startParameter
  if (sp.projectProperties != null) {
    sp.projectProperties['reactNativeArchitectures'] = forcedAbi
  }
} catch (Exception ignore) {
}

buildscript {
  ext {
    minSdkVersion = 27
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.1')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url "https://artifact.bytedance.com/repository/pangle" }
    maven { url 'https://devrepo.kakao.com/nexus/content/groups/public/' }
    maven { url 'https://www.jitpack.io' }
    maven { url 'https://devrepo.kakao.com/nexus/repository/kakaodev-releases/' }
    maven {
      url "$rootDir/../node_modules/@notifee/react-native/android/libs"
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
